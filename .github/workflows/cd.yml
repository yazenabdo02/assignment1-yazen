name: CD (deploy backend to IIS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  SITE_PATH: 'C:\inetpub\wwwroot\statusboard-backend'
  BACKUP_ROOT: 'C:\deployments\backups\statusboard-backend'
  APP_POOL: 'statusboard-backend'
  HEALTH_URL: 'http://localhost:8888/health'
  KEEP_BACKUPS: '5'

defaults:
  run:
    shell: powershell

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Keep only production dependencies
        run: npm prune --omit=dev

      - name: Back up the current site
        run: |
          $ts = Get-Date -Format "yyyyMMdd-HHmmss"
          New-Item -ItemType Directory -Force -Path $env:BACKUP_ROOT | Out-Null
          if (Test-Path $env:SITE_PATH) {
            $backup = Join-Path $env:BACKUP_ROOT "backend-$ts.zip"
            Compress-Archive -Path (Join-Path $env:SITE_PATH '*') -DestinationPath $backup -Force
            Write-Host "Backup created: $backup"
          } else {
            Write-Host "No existing site to back up (first deploy)."
          }
          Get-ChildItem $env:BACKUP_ROOT -Filter 'backend-*.zip' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip ([int]$env:KEEP_BACKUPS) |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Deploy files to the IIS site
        run: |
          Import-Module WebAdministration
          $pool = $env:APP_POOL

          if (Test-Path "IIS:\AppPools\$pool") {
            if ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped') {
              Stop-WebAppPool -Name $pool -ErrorAction SilentlyContinue
            }
            for ($i = 0; $i -lt 30 -and (Get-WebAppPoolState -Name $pool).Value -ne 'Stopped'; $i++) {
              Start-Sleep -Seconds 1
            }
            Write-Host "App pool state before copy: $((Get-WebAppPoolState -Name $pool).Value)"
          }

          New-Item -ItemType Directory -Force -Path $env:SITE_PATH | Out-Null
          robocopy "." $env:SITE_PATH /MIR /XD ".git" ".github" "tests" "coverage" "dist" /XF ".gitignore" | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          cmd /c exit 0

          for ($i = 0; $i -lt 10; $i++) {
            if ((Get-WebAppPoolState -Name $pool).Value -eq 'Started') { break }
            try { Start-WebAppPool -Name $pool -ErrorAction Stop } catch { Write-Host "start attempt $($i + 1): $_" }
            Start-Sleep -Seconds 2
          }
          if ((Get-WebAppPoolState -Name $pool).Value -ne 'Started') { throw "App pool '$pool' did not reach Started." }
          Write-Host "Deployed to $env:SITE_PATH"

      - name: Health check (roll back on failure)
        run: |
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            try {
              $resp = Invoke-WebRequest -UseBasicParsing -Uri $env:HEALTH_URL -TimeoutSec 20
              if ($resp.StatusCode -eq 200) { $ok = $true; Write-Host "Health check passed: $($resp.Content)"; break }
              Write-Host "Attempt ${i}: unexpected status $($resp.StatusCode)"
            } catch {
              Write-Host "Attempt $i failed: $_"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Host "Health check FAILED after 5 attempts. Rolling back..."
            $latest = Get-ChildItem $env:BACKUP_ROOT -Filter 'backend-*.zip' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latest) {
              Write-Host "Rolling back to $($latest.Name)"
              Import-Module WebAdministration
              Stop-WebAppPool -Name $env:APP_POOL -ErrorAction SilentlyContinue
              Get-ChildItem $env:SITE_PATH -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive -Path $latest.FullName -DestinationPath $env:SITE_PATH -Force
              Start-WebAppPool -Name $env:APP_POOL
              Write-Host "Rollback complete."
            } else {
              Write-Host "No backup found to roll back to."
            }
            exit 1
          }

  release:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Create the tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $body = @{
            tag_name         = "backend-v${{ github.event.inputs.version }}"
            target_commitish = "${{ github.sha }}"
            name             = "backend v${{ github.event.inputs.version }}"
            body             = "Deployed to IIS by the CD pipeline."
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent"  = "cd-pipeline"
            Accept        = "application/vnd.github+json"
          }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers -Body $body
          Write-Host "Release backend-v${{ github.event.inputs.version }} created."
